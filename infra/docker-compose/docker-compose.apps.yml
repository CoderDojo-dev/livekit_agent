# App-tier services. Use WITH the infra compose:
#   docker compose -f infra/docker-compose/docker-compose.yml -f infra/docker-compose/docker-compose.apps.yml up -d --build
# Build context is the repo root (two levels up from this file).
#
# NOTE: inter-service URLs are overridden here (not in .env) because .env is shared
# with host-based dev (make dev / honcho), where localhost is correct. Under full-Docker
# each service reaches the others by Compose service name. Same precedent as DATABASE_URL.
services:
  context-service:
    build:
      context: ../..
      dockerfile: services/context-service/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8101:8101"]
    restart: unless-stopped
  knowledge-service:
    build:
      context: ../..
      dockerfile: services/knowledge-service/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
      QDRANT_URL: "http://qdrant:6333"
      # Container path of the weights baked in at build time - pinned here so a host-oriented
      # .env cannot point the service at a directory that does not exist inside the image.
      EMBEDDING_CACHE_DIR: "/opt/models"
      HF_HOME: "/opt/models"
      # Cap torch/numpy CPU threads to 4 — the CE gate's set_num_threads() is not always
      # respected (other libs can reset it), so OMP/MKL env vars are the reliable control.
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_SECURE: "false"
      KNOWLEDGE_MINIO_BUCKET: "${KNOWLEDGE_MINIO_BUCKET:-telecom-knowledge}"
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ["8102:8102"]
    volumes:
      # Persist the model cache (dense, sparse, CE) across container recreations.
      # First start: populated from the image (E5 + BM25 baked). CE model downloads
      # at runtime and survives subsequent `up -d` recreations.
      - knowledge-models:/opt/models
    restart: unless-stopped
  decision-service:
    build:
      context: ../..
      dockerfile: services/decision-service/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8103:8103"]
    restart: unless-stopped
  policy-service:
    build:
      context: ../..
      dockerfile: services/policy-service/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8104:8104"]
    restart: unless-stopped
  execution-service:
    build:
      context: ../..
      dockerfile: services/execution-service/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8105:8105"]
    restart: unless-stopped
  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8106:8106"]
    restart: unless-stopped
  token-service:
    build:
      context: ../..
      dockerfile: apps/token-service/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
      LIVEKIT_AGENT_NAME: "${LIVEKIT_AGENT_NAME:-telecom-agent}"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8107:8107"]
    restart: unless-stopped
  business-api:
    build:
      context: ../..
      dockerfile: apps/business-api/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
      MINIO_ENDPOINT: "minio:9000"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ["8108:8108"]
    restart: unless-stopped
  ai-knowledge-rag:
    build:
      context: ../..
      dockerfile: mcp-servers/ai-knowledge-rag/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
      KNOWLEDGE_SERVICE_URL: "http://knowledge-service:8102"
    depends_on:
      postgres: { condition: service_healthy }
      knowledge-service: { condition: service_started }
    ports: ["8201:8201"]
    restart: unless-stopped
  ticketing-glpi:
    build:
      context: ../..
      dockerfile: mcp-servers/ticketing-glpi/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8106"
      CONNECTOR_MODE: "${CONNECTOR_MODE:-mock}"
      GLPI_BASE_URL: "${GLPI_BASE_URL:-}"
      GLPI_APP_TOKEN: "${GLPI_APP_TOKEN:-}"
      GLPI_USER_TOKEN: "${GLPI_USER_TOKEN:-}"
    depends_on:
      postgres: { condition: service_healthy }
      notification-service: { condition: service_started }
    ports: ["8202:8202"]
    restart: unless-stopped
  messaging-gateway:
    build:
      context: ../..
      dockerfile: mcp-servers/messaging-gateway/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8106"
    depends_on:
      postgres: { condition: service_healthy }
      notification-service: { condition: service_started }
    ports: ["8203:8203"]
    restart: unless-stopped
  agent-worker:
    build:
      context: ../..
      dockerfile: apps/agent-worker/Dockerfile
    env_file: [../../.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom}@postgres:5432/${POSTGRES_DB:-telecom}"
      LIVEKIT_AGENT_NAME: "${LIVEKIT_AGENT_NAME:-telecom-agent}"
      CONTEXT_SERVICE_URL: "http://context-service:8101"
      DECISION_SERVICE_URL: "http://decision-service:8103"
      POLICY_SERVICE_URL: "http://policy-service:8104"
      EXECUTION_SERVICE_URL: "http://execution-service:8105"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8106"
      KNOWLEDGE_MCP_URL: "http://ai-knowledge-rag:8201/mcp"
      TICKETING_MCP_URL: "http://ticketing-glpi:8202/mcp"
      TICKETING_HTTP_URL: "http://ticketing-glpi:8202"
    depends_on:
      postgres: { condition: service_healthy }
      context-service: { condition: service_started }
      decision-service: { condition: service_started }
      policy-service: { condition: service_started }
      execution-service: { condition: service_started }
      notification-service: { condition: service_started }
      ai-knowledge-rag: { condition: service_started }
      ticketing-glpi: { condition: service_started }
    restart: unless-stopped

volumes:
  knowledge-models:
