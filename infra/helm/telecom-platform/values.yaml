# Global settings — overridden per environment via --values staging.yaml / prod.yaml
global:
  imageRegistry: ghcr.io
  imageTag: latest
  imagePullPolicy: Always
  internalApiKey: ""  # set via --set global.internalApiKey=... or sealed-secret
  postgres:
    host: postgres
    port: 5432
    user: telecom
    password: telecom
    database: telecom
  redis:
    host: redis
    port: 6379
  livekit:
    host: livekit-server
    port: 7880
    apiKey: devkey
    apiSecret: devsecret_change_me

# --- Services ---
contextService:
  replicaCount: 2
  image:
    repository: context-service
  port: 8101

knowledgeService:
  replicaCount: 2
  image:
    repository: knowledge-service
  port: 8102

decisionService:
  replicaCount: 2
  image:
