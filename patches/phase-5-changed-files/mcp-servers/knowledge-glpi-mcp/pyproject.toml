[project]
name = "knowledge-glpi-mcp"
version = "0.1.0"
description = "Internal MCP server: knowledge_search (Phase 5) + GLPI ticket ops (Phase 9)."
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.12,<2",
  "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]