{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .name }} }
  template:
    metadata:
      labels: { app: {{ .name }} }
    spec:
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.registry }}/{{ .name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .port }}
          envFrom:
            - secretRef: { name: telecom-secrets }
          env:
            - name: CONNECTOR_MODE
              value: "{{ $.Values.env.CONNECTOR_MODE }}"
          readinessProbe:
            httpGet: { path: /health, port: {{ .port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  type: {{ if .public }}LoadBalancer{{ else }}ClusterIP{{ end }}
  selector: { app: {{ .name }} }
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.worker.name }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: { app: {{ .Values.worker.name }} }
  template:
    metadata:
      labels: { app: {{ .Values.worker.name }} }
    spec:
      containers:
        - name: {{ .Values.worker.name }}
          image: "{{ .Values.image.registry }}/{{ .Values.worker.name }}:{{ .Values.image.tag }}"
          envFrom:
            - secretRef: { name: telecom-secrets }