[project]
name = "policy-service"
version = "0.1.0"
description = "Deterministic guardrail/rules engine — three-way verdict (CDC 4.6/6), audited."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "domain-core",
  "audit-trail",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]