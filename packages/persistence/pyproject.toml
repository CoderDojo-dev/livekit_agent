[project]
name = "persistence"
version = "0.1.0"
description = "Shared SQLAlchemy models, engine/session, and Alembic migrations for the telecom DB."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]