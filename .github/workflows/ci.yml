name: ci

on:
  push:
    # P1-3: work happens on version_NN branches, so main-only meant CI never ran on the code being
    # written. lint/test/db-migrations now run per push; the build and scan jobs stay main-only via
    # their own `if:` guards, so this costs no registry pushes.
    branches: [ main, 'version_*' ]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff mypy
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy packages/ services/ apps/

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/admin_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: Frontend/admin_dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Frontend/customer_portal joins CI once the template has been replaced by real
  # implementations (cookbooks 1-6). Deliberately identical in shape to
  # frontend-test so both frontends fail the same way for the same reasons.
  # Independent of frontend-test: an admin_dashboard failure must not hide a
  # portal failure, and neither blocks the Python jobs.
  customer-portal-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/customer_portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: Frontend/customer_portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # The 12-check guard has never run on a developer machine (no working
      # bash). Ubuntu runners have one, so this is the first and only place it
      # is actually enforced. Before the build so a banned string or a deleted
      # fixture fails fast.
      - name: Guard (verify-portal.sh)
        run: npm run verify
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install shared packages + tooling
        run: |
          pip install --upgrade pip
          pip install ./packages/domain-core ./packages/persistence ./packages/audit-trail \
                      ./packages/pii-shield ./packages/observability-kit ./packages/service-auth \
                      ./packages/cache ./packages/object-storage ./packages/notification-client \
                      ./packages/integration-adapters
      # Mirrors services/knowledge-service/Dockerfile: install torch CPU-only FIRST so pip resolves
      # sentence-transformers' dependency to the light (~118 MB) CPU wheel instead of ~2 GB of CUDA
      # libs. Same pin as the image (2.2.2 is load-bearing for the numpy 1.x ABI).
      - name: Install torch (CPU-only) before service deps
        run: pip install --retries 10 --timeout 120 torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
      # P1-3: run_tests.py sets PYTHONPATH but installs nothing, so every target's third-party
      # dependencies must be present first. This list mirrors the Makefile `install` target.
      - name: Install services, MCP servers and apps
        run: |
          pip install ./services/context-service ./services/knowledge-service ./services/decision-service \
                      ./services/policy-service ./services/execution-service ./services/notification-service \
                      ./apps/token-service ./apps/business-api
          pip install ./mcp-servers/ai-knowledge-rag ./mcp-servers/ticketing-glpi ./mcp-servers/messaging-gateway
          pip install ./apps/agent-worker
      # P1-3: single source of truth. `make test` and CI now run the identical inventory, so the two
      # can no longer drift. Adding a target in run_tests.py is enough to add it to CI.
      - name: Offline test suite
        run: python scripts/run_tests.py

  db-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: telecom
          POSTGRES_PASSWORD: telecom
          POSTGRES_DB: telecom
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U telecom" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply migrations + seeds
        env:
          DATABASE_URL: postgresql+psycopg://telecom:telecom@localhost:5432/telecom
        run: |
          pip install ./packages/domain-core ./packages/persistence
          cd packages/persistence
          alembic upgrade head
          python -m seed.seed_pilot
          python -m seed.seed_reference

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, db-migrations]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        # P1-3: only the six that actually live under services/. token-service, business-api and
        # agent-worker live under apps/ and are built by docker-build-apps with the correct path;
        # listing them here built them from a non-existent file and double-pushed the same tags.
        service:
          - context-service
          - decision-service
          - policy-service
          - execution-service
          - knowledge-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }},${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest

  docker-build-apps:
    runs-on: ubuntu-latest
    needs: [test, db-migrations]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - token-service
          - business-api
          - agent-worker
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }},${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest

  security-scan:
    runs-on: ubuntu-latest
    needs: [docker-build, docker-build-apps]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - context-service
          - decision-service
          - policy-service
          - execution-service
          - knowledge-service
          - notification-service
          - token-service
          - business-api
          - agent-worker
    steps:
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
