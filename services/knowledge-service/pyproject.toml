[project]
name = "knowledge-service"
version = "0.1.0"
description = "RAG over the documentation corpus + vector store (Qdrant)."
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "service-auth",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "domain-core",
  "qdrant-client==1.12.1",
  "fastembed==0.8.0",
  "sentence-transformers==3.3.1",
  "huggingface-hub==0.26.5",
  "numpy>=1.26,<2",
  "persistence",
  "object-storage",
  "minio>=7.2",
  "pypdf==5.9.0",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
]

[project.scripts]
knowledge-service = "knowledge_service.main:run"
knowledge-bootstrap-qdrant = "knowledge_service.qdrant_store:bootstrap"
knowledge-ingest = "knowledge_service.ingestion:run"
knowledge-sync-outbox = "knowledge_service.sync_worker:run"
knowledge-reindex = "knowledge_service.reindex:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
