[project]
name = "knowledge-service"
version = "0.2.0"
description = "RAG over the documentation corpus with NVIDIA NIM and Qdrant."
requires-python = ">=3.12"
dependencies = [
  "domain-core",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "qdrant-client==1.12.1",
  "service-auth",
  "uvicorn[standard]==0.34.0",
]

[project.scripts]
knowledge-service = "knowledge_service.main:run"
knowledge-bootstrap-qdrant = "knowledge_service.qdrant_store:run_bootstrap"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
