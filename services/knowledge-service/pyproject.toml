[project]
name = "knowledge-service"
version = "0.6.0"
description = "Production-gated hybrid RAG with NVIDIA NIM, Qdrant, MinIO, and Postgres."
requires-python = ">=3.12"
dependencies = [
  "domain-core",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "minio>=7.2",
  "object-storage",
  "persistence",
  "pypdf>=5.0,<6",
  "qdrant-client==1.12.1",
  "service-auth",
  "uvicorn[standard]==0.34.0",
]

[project.scripts]
knowledge-service = "knowledge_service.main:run"
knowledge-bootstrap-qdrant = "knowledge_service.qdrant_store:run_bootstrap"
knowledge-bootstrap-bucket = "knowledge_service.knowledge_storage:bootstrap_knowledge_bucket"
knowledge-ingest = "knowledge_service.ingest_cli:main"
knowledge-outbox-worker = "knowledge_service.outbox_worker:main"
knowledge-quality-gate = "knowledge_service.quality_eval:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
