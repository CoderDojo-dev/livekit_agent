[project]
name = "agent-worker"
version = "0.1.1"
description = "LiveKit Agents real-time orchestrator. Thin tools; zero business logic."
requires-python = ">=3.12"
dependencies = [
  "object-storage",
  "service-auth",
  "audit-trail",
  "persistence",
  "livekit-agents==1.6.3",
  "livekit-plugins-azure>=1.6.3",
  "livekit-plugins-cartesia>=1.6.3",
  "livekit-plugins-deepgram>=1.6.3",
  "livekit-plugins-elevenlabs>=1.6.3",
  "livekit-plugins-gladia>=1.6.3",
  "livekit-plugins-google>=1.6.3",
  "livekit-plugins-openai>=1.6.3",
  "livekit-plugins-silero>=1.6.3",
  "livekit-plugins-turn-detector>=1.6.3",
  "mcp>=1.24,<2",
  "pydantic>=2.11.0,<3",
  "pydantic-settings==2.7.1",
  "httpx==0.28.1",
  "structlog==24.4.0",
  "python-dotenv==1.0.1",
  "domain-core",
  "observability-kit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
