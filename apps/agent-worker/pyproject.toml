[project]
name = "agent-worker"
version = "0.1.0"
description = "LiveKit Agents real-time orchestrator. Thin tools; zero business logic."
requires-python = ">=3.12"
dependencies = [
  "object-storage",
  "service-auth",
  "audit-trail",
  "persistence",
  "livekit-agents[deepgram,elevenlabs,azure,openai,google,silero,turn-detector,gladia,cartesia]==1.6.5",
  "mcp>=1.24,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings==2.7.1",
  "httpx==0.28.1",
  "structlog==24.4.0",
  "python-dotenv==1.0.1",
  "domain-core",
  "observability-kit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
